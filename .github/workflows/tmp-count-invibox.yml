name: tmp-count-invibox
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Count users (read-only)
        run: |
          npx -y wrangler@latest d1 execute invibox-db --remote --command "SELECT count(*) AS users FROM users;"
          npx -y wrangler@latest d1 execute invibox-db --remote --command "SELECT email, created_at FROM users ORDER BY created_at LIMIT 10;"
