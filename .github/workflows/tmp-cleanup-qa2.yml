name: tmp-cleanup-qa2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user from subscription-tracker-db
        run: |
          U="91f98e2a-e071-412f-af0c-8b8fe6bc88a9"
          npx -y wrangler@latest d1 execute subscription-tracker-db --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute subscription-tracker-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
